<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>统计图表-WeAdmin Frame型后台管理系统-WeAdmin 1.0</title>
  <meta name="renderer" content="webkit|ie-comp|ie-stand">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta http-equiv="Cache-Control" content="no-siteapp" />
  <link rel="stylesheet" href="../../static/css/font.css">
  <link rel="stylesheet" href="../../static/css/weadmin.css">
</head>

<body>
  <div class="weadmin-body" style="width: 95%; min-height: 500px;">
    <blockquote class="layui-elem-quote">
      在横向柱状图中，价格排名前十的店铺被清晰展示，每个条形代表一个店铺，长度与其定价策略和市场吸引力成正比
    </blockquote>
    <!-- 为 ECharts 准备一个具备大小（宽高）的 DOM -->
    <div id="main" style="width: 100%;height:400px;"></div>

  </div>
  <script src="//cdn.bootcss.com/echarts/4.0.2/echarts.min.js"></script>
<script src="https://cdn.bootcss.com/jquery/3.4.1/jquery.min.js"></script>
  <script type="text/javascript">
	$(function(){
		$.ajax({
			url:"http://127.0.0.1:9999/analyse/getPrice1",
			type:"get",
			success:function(res){
				var x =[]
				var y= []
				for(var i =0;i<res.length;i++){

					x[i]=res[i][0].split(" ")[0]
					// { value: -0.07, label: labelRight },
					y.push({value:res[i][1],label: labelRight})
				}
				// 基于准备好的dom，初始化echarts实例
				var myChart = echarts.init(document.getElementById('main'));

				// 指定图表的配置项和数据
				var labelRight = {
				  normal: {
				    position: 'right'
				  }
				};
				option = {
				  title: {
				    text: '价格排行榜',
                    left: 'center' // 将标题居中
				  },
				  tooltip: {
				    trigger: 'axis',
				    axisPointer: {            // 坐标轴指示器，坐标轴触发有效
				      type: 'shadow'        // 默认为直线，可选为：'line' | 'shadow'
				    }
				  },
				  grid: {
				    top: 100,
				    bottom: 10,
                    left: 50, // 增加左侧边距
                    right: 50 // 增加右侧边距
				  },
				  xAxis: {
				    type: 'value',
				    position: 'top',
				    splitLine: { lineStyle: { type: 'dashed' } },
                        axisLabel: {
                            fontSize: 14, // 调整字体大小
                            color: '#333' // 调整字体颜色
                        },
                        axisTick: {
                        show: true, // 显示刻度线
                        length: 6 // 调整刻度线长度
                    }
				  },
				  yAxis: {
				    type: 'category',
				    axisLine: { show: false },
				    axisLabel: { show: false },
				    axisTick: { show: false },
				    splitLine: { show: false },
				    data: x,
                    axisLabel: {
                        fontSize: 14, // 调整字体大小
                        color: '#333' // 调整字体颜色
                    },
                    axisTick: {
                        interval: function (index, value) {
                        return index % 2 === 0; // 每隔一个刻度显示一次
                        }
                    }
				  },
				  series: [
				    {
				      name: '价格',
				      type: 'bar',
				      stack: '总量',
				      label: {
				        normal: {
				          show: true,
				          formatter: '{b}',
                          position: 'insideRight', // 将标签放在柱子内部右侧
                          fontSize: 14, // 调整字体大小
                          color: '#fff' // 调整字体颜色
				        }
				      },
				      data:y,
                      axisLabel: {
                        color: '#333', // 调整字体颜色
                      }
				    }
				  ]
				};
				// 使用刚指定的配置项和数据显示图表。
				myChart.setOption(option);
			}
		})
	})

  </script>

</body>

</html>
