<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据表列表</title>
    <link rel="stylesheet" href="/lib/layui/css/layui.css">
    <script src="/lib/layui/layui.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/modern-layout.css">
    <style>
        body {
            padding: 20px;
            background: transparent;
        }
        .table-list-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .table-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 243, 255, 0.15);
            border-radius: var(--card-radius);
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .table-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 243, 255, 0.2);
            border-color: rgba(0, 243, 255, 0.3);
        }
        .table-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }
        .table-card-icon {
            width: 48px;
            height: 48px;
            background: rgba(0, 243, 255, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .table-card-icon i {
            font-size: 24px;
            color: var(--primary);
        }
        .table-card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .table-card-info {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .table-card-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        .table-card-actions button {
            flex: 1;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
        }
        .btn-view {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
        }
        .btn-view:hover {
            box-shadow: 0 4px 15px rgba(0, 243, 255, 0.4);
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        .loading-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #00ff88, #00f3ff);
            border-radius: 16px;
            margin: 0 auto 20px;
            animation: jelly 1.2s ease-in-out infinite;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5), 0 0 60px rgba(0, 243, 255, 0.3);
            position: relative;
        }
        .loading-icon::before,
        .loading-icon::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
        }
        .loading-icon::before {
            width: 20px;
            height: 20px;
            top: 12px;
            left: 12px;
        }
        .loading-icon::after {
            width: 10px;
            height: 10px;
            bottom: 15px;
            right: 15px;
        }
        @keyframes jelly {
            0%, 100% { transform: scale(1, 1) rotate(0deg); }
            25% { transform: scale(0.9, 1.1) rotate(-5deg); }
            50% { transform: scale(1.1, 0.9) rotate(5deg); }
            75% { transform: scale(0.95, 1.05) rotate(-3deg); }
        }
    </style>
</head>
<body>
    <div class="page-title">
        <h1><i class="fas fa-table"></i> 数据表列表</h1>
        <p>查看和管理您的商品数据表</p>
    </div>

    <div id="loading" class="loading">
        <div class="loading-icon"></div>
        <p>正在加载数据表...</p>
    </div>

    <div id="table-list" class="table-list-container"></div>

    <script>
        layui.use(['layer'], function() {
            const layer = layui.layer;

            // 加载数据表列表
            fetch('/tables')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';

                    if (data && Array.isArray(data) && data.length > 0) {
                        renderTableCards(data);
                    } else {
                        document.getElementById('table-list').innerHTML = `
                            <div style="grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-secondary);">
                                <i class="fas fa-inbox" style="font-size: 64px; margin-bottom: 20px; opacity: 0.5;"></i>
                                <p>暂无数据表</p>
                                <p style="font-size: 14px; margin-top: 10px;">请先通过爬虫采集数据</p>
                            </div>
                        `;
                    }
                })
                .catch(err => {
                    document.getElementById('loading').style.display = 'none';
                    layer.msg('加载数据表失败：' + err.message, {icon: 2});
                });

            function renderTableCards(tables) {
                const container = document.getElementById('table-list');
                container.innerHTML = tables.map(table => `
                    <div class="table-card" onclick="viewTable('${table}')">
                        <div class="table-card-header">
                            <div class="table-card-icon">
                                <i class="fas fa-database"></i>
                            </div>
                            <div class="table-card-title" title="${table}">${table}</div>
                        </div>
                        <div class="table-card-info">
                            <span><i class="fas fa-list"></i> 商品数据</span>
                            <span><i class="fas fa-check-circle" style="color: #00ff88;"></i> 可用</span>
                        </div>
                        <div class="table-card-actions">
                            <button class="btn-view" onclick="event.stopPropagation(); viewTable('${table}')">
                                <i class="fas fa-eye"></i> 查看
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            function viewTable(tableName) {
                // 在新窗口打开表格详情页
                window.open('/' + tableName, '_blank');
            }
        });
    </script>
</body>
</html>
