<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最佳商品推荐</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root {
            --primary: #00ff88;
            --secondary: #00f3ff;
            --accent: #00ccff;
            --dark-bg: #0a0f14;
            --panel-bg: rgba(16, 24, 32, 0.95);
            --glass-bg: rgba(20, 30, 40, 0.8);
            --border-glow: rgba(0, 243, 255, 0.3);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-muted: rgba(255, 255, 255, 0.5);
            --card-radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 30px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(rgba(0, 243, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: -1;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(90deg, #00ff88 0%, #00f3ff 50%, #00ccff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }

        h2 {
            color: rgba(255, 255, 255, 0.9);
            font-size: 20px;
            margin: 30px 0 15px 0;
            padding: 12px 20px;
            border-left: 4px solid #00ff88;
            background: linear-gradient(90deg, rgba(0, 255, 136, 0.1) 0%, transparent 100%);
            border-radius: 0 8px 8px 0;
            font-weight: 600;
        }

        .chart-container {
            background: linear-gradient(145deg, rgba(45, 45, 65, 0.98) 0%, rgba(25, 25, 40, 0.98) 100%);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 255, 136, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .chart-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00ff88, #00f3ff);
            opacity: 0.8;
        }

        .chart-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 243, 255, 0.15);
            border-color: rgba(0, 255, 136, 0.4);
        }

        .image-container {
            background: linear-gradient(145deg, rgba(45, 45, 65, 0.98) 0%, rgba(25, 25, 40, 0.98) 100%);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .image-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00f3ff, #00ccff);
            opacity: 0.8;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: var(--secondary);
            font-size: 16px;
        }

        .loading::before {
            content: '';
            display: block;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #00ff88, #00f3ff);
            border-radius: 12px;
            margin: 0 auto 15px;
            animation: jelly 1.2s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5), 0 0 40px rgba(0, 243, 255, 0.3);
        }

        @keyframes jelly {
            0%, 100% { transform: scale(1, 1) rotate(0deg); }
            25% { transform: scale(0.9, 1.1) rotate(-5deg); }
            50% { transform: scale(1.1, 0.9) rotate(5deg); }
            75% { transform: scale(0.95, 1.05) rotate(-3deg); }
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary), var(--secondary));
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>最佳商品推荐</h1>

    <div id="loading" class="loading">正在加载数据...</div>

    <!-- 评论数前十店铺 -->
    <div class="chart-container" id="bar_commit_container" style="display: none;">
        <h2>评论数前十店铺</h2>
        <div id="bar_commit" style="width: 100%; height: 400px;"></div>
    </div>

    <!-- 价格排名前十店铺 -->
    <div class="chart-container" id="bar_price_shops_container" style="display: none;">
        <h2>价格排名前十店铺</h2>
        <div id="bar_price_shops" style="width: 100%; height: 400px;"></div>
    </div>

    <!-- 价格排名前十商品 -->
    <div class="chart-container" id="bar_price_items_container" style="display: none;">
        <h2>价格排名前十商品</h2>
        <div id="bar_price_items" style="width: 100%; height: 400px;"></div>
    </div>

    <!-- 价格分布图 -->
    <div class="image-container" id="price_dist_container" style="display: none;">
        <h2>价格分布</h2>
        <img id="price_distribution" src="" alt="价格分布">
    </div>

    <!-- 评论数分布图 -->
    <div class="image-container" id="commit_dist_container" style="display: none;">
        <h2>评论数分布</h2>
        <img id="commit_distribution" src="" alt="评论数分布">
    </div>

    <script>
        $(document).ready(function() {
            // 弹出提示框获取文件名
            var file_name = prompt("请输入要查询的商品名：");
            if (file_name) {
                // 发送文件名到后端
                $.ajax({
                    url: '/process1',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({file_name: file_name}),
                    success: function(response) {
                        $('#loading').hide();

                        if (response.error) {
                            alert(response.error);
                            $('#loading').text(response.error).show();
                        } else {
                            // 渲染图表
                            if (response.bar_commit) {
                                $('#bar_commit_container').show();
                                var bar_commit = echarts.init(document.getElementById('bar_commit'), 'dark');
                                bar_commit.setOption(JSON.parse(response.bar_commit));
                            }
                            if (response.bar_price_shops) {
                                $('#bar_price_shops_container').show();
                                var bar_price_shops = echarts.init(document.getElementById('bar_price_shops'), 'dark');
                                bar_price_shops.setOption(JSON.parse(response.bar_price_shops));
                            }
                            if (response.bar_price_items) {
                                $('#bar_price_items_container').show();
                                var bar_price_items = echarts.init(document.getElementById('bar_price_items'), 'dark');
                                bar_price_items.setOption(JSON.parse(response.bar_price_items));
                            }
                            if (response.price_distribution) {
                                $('#price_dist_container').show();
                                document.getElementById('price_distribution').src = 'data:image/png;base64,' + response.price_distribution;
                            }
                            if (response.commit_distribution) {
                                $('#commit_dist_container').show();
                                document.getElementById('commit_distribution').src = 'data:image/png;base64,' + response.commit_distribution;
                            }
                        }
                    },
                    error: function() {
                        $('#loading').text('无法加载文件，请检查文件名是否正确。').show();
                    }
                });
            } else {
                $('#loading').text('请输入商品名称').show();
            }
        });
    </script>
</body>
</html>
